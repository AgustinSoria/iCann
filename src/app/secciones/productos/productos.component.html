<div class="productos-wrapper">

  <!-- SLIDER -->
  <div class="slider" [style.transform]="'translateX(-' + currentSlide * 100 + 'vw)'">

    <div
      class="slide"
      *ngFor="let p of products"
      [style.background]="p.gradient ? p.gradient : p.backgroundColor"
    >
      <div class="slide-content">

        <!-- Título centrado arriba -->
        <h1 class="product-title">{{ p.title }}</h1>
        <h2 class="product-subtitle">{{ p.subtitle }}</h2>

        <div class="product-body">

          <!-- Imagen -->
          <div class="product-image">
            <img [src]="p.image" [alt]="p.title" />
          </div>

          <!-- Texto -->
          <div class="product-info">

            <h3>Descripción</h3>
            <p *ngFor="let d of p.description">{{ d }}</p>

            <h3>Usos</h3>
            <ul>
              <li *ngFor="let u of p.uses">{{ u }}</li>
            </ul>

            <h3>Propiedades</h3>
            <ul>
              <li *ngFor="let pr of p.properties">{{ pr }}</li>
            </ul>

          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- BOTONES SLIDER -->
  <button class="nav-btn left" (click)="prevSlide()">❮</button>
  <button class="nav-btn right" (click)="nextSlide()">❯</button>

  <!-- INDICADORES -->
  <div class="dots">
    <span
      class="dot"
      *ngFor="let p of products; index as i"
      [class.active]="i === currentSlide"
      (click)="goToSlide(i)"
    ></span>
  </div>

</div>
